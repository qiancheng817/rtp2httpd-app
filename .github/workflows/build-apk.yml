name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          echo "GRADLE_HOME=/tmp/gradle-8.9" >> $GITHUB_ENV
          echo "PATH=/tmp/gradle-8.9/bin:$PATH" >> $GITHUB_ENV

      # 用 Actions Cache 持久化 release keystore，保证每次构建签名一致、用户可正常升级安装
      - name: Restore release keystore from cache
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/release.keystore
          key: release-keystore-v1

      - name: Generate release keystore (if cache miss)
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/release.keystore \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass rtp2httpd -keypass rtp2httpd \
            -dname "CN=Rtp2Httpd, OU=Personal, O=Personal, L=Unknown, S=Unknown, C=CN"

      - name: Assemble Release APK
        run: gradle assembleRelease

      - name: Verify APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          echo "APK: $APK"
          ls -lh "$APK"
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify --verbose "$APK" || true

      - name: Upload APK as GitHub Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest-${{ github.run_number }}
          name: "rtp2httpd APK (release) — run ${{ github.run_number }}"
          body: |
            自动构建的 release 签名包（自用不上架）。安装时在手机设置里开启「允许安装未知来源应用」。
            - package: `com.rtp2httpd.app`
            - minSdk: 24 (Android 7.0)
            - targetSdk: 34 (Android 14)
            - 首次打开在 **设置** 里填入 rtp2httpd 服务器地址，例如 `http://rtp2httpd服务器的IP:5140`
          files: app/build/outputs/apk/release/app-release.apk

      - name: Upload APK to Run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
