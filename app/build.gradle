plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rtp2httpd.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.rtp2httpd.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // 优先使用稳定的 release keystore（CI 通过 cache 提供，保证签名一致可升级）
            def releaseKey = file("${System.getProperty('user.home')}/.android/release.keystore")
            if (releaseKey.exists()) {
                signingConfigs {
                    release {
                        storeFile releaseKey
                        storePassword "rtp2httpd"
                        keyAlias "release"
                        keyPassword "rtp2httpd"
                    }
                }
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.code.gson:gson:2.11.0'
}
